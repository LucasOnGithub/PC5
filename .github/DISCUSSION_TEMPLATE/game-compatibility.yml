title: "[Game name]"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        One report per game and PC5 version: how the game runs in PC5. Within a minute or two of posting, your report is in the [game compatibility list](https://github.com/bornaradusin/PC5/wiki/Game-compatibility).

        **A game that doesn't start or isn't playable needs an issue first.** Open an [issue](https://github.com/bornaradusin/PC5/issues/new/choose) with the game's log from `/data/prospero-win/logs/`, then put its number in **Issue** below. A report of a game that doesn't run, without an issue, isn't listed and is closed. While its issue is open the game is listed as being looked at, and it is listed as not running once the issue is marked wontfix.
  - type: input
    id: game
    attributes:
      label: Game
      description: Its name, as the store or its title screen has it.
      placeholder: "Example: Stardew Valley"
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Store and version
      description: Where it's from, and its version if you know it.
      placeholder: "Example: GOG, 1.6.15"
    validations:
      required: false
  - type: dropdown
    id: result
    attributes:
      label: How it runs
      options:
        - Works perfectly
        - Playable with issues
        - Starts but not playable
        - Doesn't start
    validations:
      required: true
  - type: input
    id: issue
    attributes:
      label: Issue
      description: For a game that doesn't start or isn't playable, the issue you opened for it with its log. Leave it empty for a game that runs.
      placeholder: "Example: #61"
    validations:
      required: false
  - type: input
    id: pc5
    attributes:
      label: PC5 version
      description: Options › About PC5.
      placeholder: "Example: 1.4.0"
    validations:
      required: true
  - type: dropdown
    id: controller
    attributes:
      label: Controller mode
      description: △ on the game › Controller.
      options:
        - Xbox controller
        - DualSense
        - Keyboard & mouse
    validations:
      required: false
  - type: textarea
    id: settings
    attributes:
      label: Settings that helped
      description: Anything you changed for it to run well, such as launch options (launch.txt), Change program, Resolution, Memory or Frame generation.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What works, what doesn't, and how well it runs (frame rate, sound, movies, saves).
    validations:
      required: false
