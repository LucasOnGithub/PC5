# Builds PC5 from source on GitHub's machines (tools/build.sh, every step) and, when asked,
# makes a draft release with its three archives for the maintainer to check and publish.
# Run it from the Actions tab: Build › Run workflow.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Make a draft release v<PC5_VERSION> with the archives (otherwise they are kept as the run's artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      PC5_RELEASE: /mnt/pc5/release
      PC5_ZINK_JOBS: "2"
    steps:
      - uses: actions/checkout@v5

      - name: Room to build
        # The build needs about 30 GB and Zink's link about 8 GB of memory: the machine's
        # second disk (/mnt) holds the build and a swap file, and unused tools make room.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/pc5/build /mnt/pc5/release
          sudo chown -R "$USER" /mnt/pc5
          ln -s /mnt/pc5/build .build
          sudo fallocate -l 8G /mnt/pc5/swap && sudo chmod 600 /mnt/pc5/swap
          sudo mkswap /mnt/pc5/swap >/dev/null && sudo swapon /mnt/pc5/swap
          df -h / /mnt; free -g

      - name: Packages
        timeout-minutes: 30
        # Only Ubuntu's own sources (the machine's others, Microsoft's and the like, can stall a
        # download), short timeouts with retries, and without man-db's index, which is rebuilt
        # after every package.
        run: |
          mkdir -p .build/logs
          {
            sudo rm -f /var/lib/man-db/auto-update
            sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
            # The Azure mirror intermittently stalls on large MinGW packages.
            # Use the official Ubuntu archive directly instead of Azure's mirrorlist.
            sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'SOURCES'
            Types: deb
            URIs: http://archive.ubuntu.com/ubuntu/
            Suites: noble noble-updates noble-backports noble-security
            Components: main restricted universe multiverse
            Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
            SOURCES
            apt="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
            sudo apt-get update -q $apt
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $apt \
              -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=300 $(cat tools/packages.txt)
          } 2>&1 | tee .build/logs/packages.log
          exit "${PIPESTATUS[0]}"

      - name: Sources
        run: bash tools/build.sh sources

      - name: Tests
        run: bash tests/test.sh

      - name: Cache keys
        id: keys
        # Each slow part is kept between runs under a fingerprint of what it is built from,
        # and built again only when that changes. Wine (both), RADV and the 32-bit CPU: the
        # build's pins and packages and patches/prospero-win and patches/radv (PC5's own code
        # in title/ goes into the eboot only). Zink: Mesa and llvm-mingw as prospero-win pins
        # them. DXVK: its commit with patches/dxvk. VKD3D-Proton: its commit with patches/vkd3d-proton.
        run: |
          pw=.build/prospero-win
          echo "wine=wine-$(cat tools/build.sh tools/packages.txt patches/prospero-win/*.patch patches/radv/*.patch | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "zink=zink-$(cat "$pw/tools/build_mesa_zink.sh" "$pw/tools/mesa_zink_manifest.py" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "dxvk=dxvk-$(git -C .build/dxvk-source rev-parse HEAD)-$(sed -n 's/^DXVK_NAME=//p' tools/build.sh)" >> "$GITHUB_OUTPUT"
          echo "vkd3d=vkd3d-$(git -C .build/vkd3d-proton-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # What packaging and the sources archive take from the Wine, RADV and CPU steps.
      - name: Restore Wine
        id: wine
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/pc5/build/prospero-win/.deps/wine-host/install
            /mnt/pc5/build/prospero-win/.deps/wine-host/build/dlls/wowprospero
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/prx
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/pe
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/report.json
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/source
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/freetype/src
            /mnt/pc5/build/prospero-win/.deps/wow64native
            /mnt/pc5/build/PS5_Vulkan/.deps/work/radv-src/subprojects/zlib-*
          key: ${{ steps.keys.outputs.wine }}

      - name: Restore Zink
        id: zink
        uses: actions/cache/restore@v4
        with:
          path: /mnt/pc5/build/mesa-zink/artifacts
          key: ${{ steps.keys.outputs.zink }}

      - name: Restore DXVK
        id: dxvk
        uses: actions/cache/restore@v4
        with:
          path: /mnt/pc5/build/dxvk
          key: ${{ steps.keys.outputs.dxvk }}

      - name: Restore VKD3D-Proton
        id: vkd3d
        uses: actions/cache/restore@v4
        with:
          path: /mnt/pc5/build/vkd3d
          key: ${{ steps.keys.outputs.vkd3d }}

      - name: Title
        run: bash tools/build.sh title

      - name: RADV
        if: steps.wine.outputs.cache-hit != 'true'
        run: bash tools/build.sh radv

      - name: Wine for this computer
        if: steps.wine.outputs.cache-hit != 'true'
        run: bash tools/build.sh hostwine

      - name: Wine for the PS5
        if: steps.wine.outputs.cache-hit != 'true'
        run: bash tools/build.sh wineps5

      - name: 32-bit games' CPU
        if: steps.wine.outputs.cache-hit != 'true'
        run: bash tools/build.sh cpu

      - name: Keep Wine
        if: steps.wine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            /mnt/pc5/build/prospero-win/.deps/wine-host/install
            /mnt/pc5/build/prospero-win/.deps/wine-host/build/dlls/wowprospero
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/prx
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/pe
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/report.json
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/source
            /mnt/pc5/build/prospero-win/.deps/wine-ps5/freetype/src
            /mnt/pc5/build/prospero-win/.deps/wow64native
            /mnt/pc5/build/PS5_Vulkan/.deps/work/radv-src/subprojects/zlib-*
          key: ${{ steps.keys.outputs.wine }}

      - name: DXVK
        run: bash tools/build.sh dxvk

      - name: Keep DXVK
        if: steps.dxvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /mnt/pc5/build/dxvk
          key: ${{ steps.keys.outputs.dxvk }}

      - name: VKD3D-Proton
        run: bash tools/build.sh vkd3d

      - name: Keep VKD3D-Proton
        if: steps.vkd3d.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /mnt/pc5/build/vkd3d
          key: ${{ steps.keys.outputs.vkd3d }}

      - name: Zink
        if: steps.zink.outputs.cache-hit != 'true'
        run: bash tools/build.sh zink

      - name: Keep Zink
        if: steps.zink.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /mnt/pc5/build/mesa-zink/artifacts
          key: ${{ steps.keys.outputs.zink }}

      - name: Package, app and sources
        run: bash tools/build.sh package app bundle

      - name: The archives
        id: archives
        # The sources step (bundle) has already put Wine Mono's source beside the other two.
        run: |
          mono=$(sed -n 's/^MONO_VERSION=//p' tools/build.sh)
          version=$(sed -n 's/^#define PC5_VERSION "\(.*\)"/\1/p' title/pc5.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd "$PC5_RELEASE"
          ls -l PPSA11018.zip PPSA11018-sources.tar.xz "wine-mono-$mono-src.tar.xz"
          sha256sum PPSA11018.zip PPSA11018-sources.tar.xz "wine-mono-$mono-src.tar.xz" | tee SHA256SUMS.txt
          {
            echo "### PC5 $version"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.archives.outputs.version }}
        # Notes from release-notes/<version>.md. A draft left by an earlier run is replaced;
        # a published release is never touched.
        run: |
          tag="v$VERSION"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$tag is already published; raise PC5_VERSION in title/pc5.h for a new release"
            exit 1
          fi
          [ "$state" = none ] || gh release delete "$tag" --yes
          notes="release-notes/$VERSION.md"
          [ -f "$notes" ] || { echo "PC5 $VERSION" > "$RUNNER_TEMP/notes.md"; notes=$RUNNER_TEMP/notes.md; }
          mono=$(sed -n 's/^MONO_VERSION=//p' tools/build.sh)
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "PC5 $VERSION" --notes-file "$notes" \
            "$PC5_RELEASE/PPSA11018.zip" "$PC5_RELEASE/PPSA11018-sources.tar.xz" "$PC5_RELEASE/wine-mono-$mono-src.tar.xz"
          echo "Draft release $tag is ready: check it and publish it from the Releases page." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the archives
        if: ${{ !inputs.draft_release }}
        uses: actions/upload-artifact@v4
        with:
          name: PC5-${{ steps.archives.outputs.version }}
          path: |
            /mnt/pc5/release/PPSA11018.zip
            /mnt/pc5/release/PPSA11018-sources.tar.xz
            /mnt/pc5/release/wine-mono-*-src.tar.xz
          compression-level: 0
          retention-days: 7

      - name: Why it failed
        if: failure()
        # The end of the newest step log as an annotation, which the run's page and the API show.
        run: |
          log=$(ls -t /mnt/pc5/build/logs/*.log 2>/dev/null | head -1)
          [ -n "$log" ] || exit 0
          tail -40 "$log" | cut -c1-300 > "$RUNNER_TEMP/tail.txt"
          body=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/tail.txt" | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=$(basename "$log")::$body"

      - name: The logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /mnt/pc5/build/logs/
          retention-days: 14
