# Builds PC5 from source on GitHub's machines (tools/build.sh, every step) and, when asked,
# makes a draft release with its three archives for the maintainer to check and publish.
# Run it from the Actions tab: Build › Run workflow.
name: Build

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Make a draft release v<PC5_VERSION> with the archives (otherwise they are kept as the run's artifacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      PC5_RELEASE: /mnt/pc5/release
      PC5_ZINK_JOBS: "2"
    steps:
      - uses: actions/checkout@v5

      - name: Room to build
        # The build needs about 30 GB and Zink's link about 8 GB of memory: the machine's
        # second disk (/mnt) holds the build and a swap file, and unused tools make room.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/pc5/build /mnt/pc5/release
          sudo chown -R "$USER" /mnt/pc5
          ln -s /mnt/pc5/build .build
          sudo fallocate -l 8G /mnt/pc5/swap && sudo chmod 600 /mnt/pc5/swap
          sudo mkswap /mnt/pc5/swap >/dev/null && sudo swapon /mnt/pc5/swap
          df -h / /mnt | tail -2; free -g | head -2

      - name: 1/12 Packages
        timeout-minutes: 15
        # Only Ubuntu's own sources, without man-db's index (rebuilt after every package). A
        # download that stalls, as GitHub's machines' sometimes do, is stopped after two
        # minutes and tried again, up to three times.
        run: |
          mkdir -p .build/logs
          bash tools/ci-step.sh 1
          sudo rm -f /var/lib/man-db/auto-update
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dpkg::Use-Pty=0"
          try() { # what, command...
            local what=$1; shift
            for attempt in 1 2 3; do
              echo "$what (try $attempt)"
              if sudo env DEBIAN_FRONTEND=noninteractive timeout 120 "$@" >> .build/logs/packages.log 2>&1; then return 0; fi
              echo "  stopped or failed; trying again"
              sudo killall -q apt-get dpkg 2>/dev/null; sleep 5
            done
            tail -30 .build/logs/packages.log; return 1
          }
          try "Package lists" apt-get update -q $apt
          try "Installing $(wc -w < tools/packages.txt) packages" \
            apt-get install -y -q --no-install-recommends $apt -o DPkg::Lock::Timeout=60 $(cat tools/packages.txt)
          echo "✓ Packages done"

      - name: 2/12 Sources
        run: bash tools/ci-step.sh 2 sources

      - name: Cache keys
        id: keys
        # Zink: Mesa and llvm-mingw as prospero-win pins them. DXVK: its commit with patches/dxvk
        # (step dxvk itself rebuilds when the patched source differs from the one kept).
        run: |
          pw=.build/prospero-win
          echo "zink=zink-$(cat "$pw/tools/build_mesa_zink.sh" "$pw/tools/mesa_zink_manifest.py" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "dxvk=dxvk-$(git -C .build/dxvk-source rev-parse HEAD)-$(sed -n 's/^DXVK_NAME=//p' tools/build.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore Zink
        id: zink
        uses: actions/cache/restore@v4
        with:
          path: .build/mesa-zink/artifacts
          key: ${{ steps.keys.outputs.zink }}

      - name: Restore DXVK
        uses: actions/cache/restore@v4
        with:
          path: .build/dxvk
          key: ${{ steps.keys.outputs.dxvk }}

      - name: 3/12 Title (PC5 itself)
        run: bash tools/ci-step.sh 3 title

      - name: 4/12 RADV (the PS5's Vulkan driver)
        run: bash tools/ci-step.sh 4 radv

      - name: 5/12 Wine for this computer
        run: bash tools/ci-step.sh 5 hostwine

      - name: 6/12 Wine for the PS5
        run: bash tools/ci-step.sh 6 wineps5

      - name: 7/12 32-bit games' CPU
        run: bash tools/ci-step.sh 7 cpu

      - name: 8/12 DXVK
        run: bash tools/ci-step.sh 8 dxvk

      - name: 9/12 Zink
        if: steps.zink.outputs.cache-hit != 'true'
        run: bash tools/ci-step.sh 9 zink

      - name: Keep Zink
        if: steps.zink.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/mesa-zink/artifacts
          key: ${{ steps.keys.outputs.zink }}

      - name: Keep DXVK
        uses: actions/cache/save@v4
        continue-on-error: true   # already kept under this key
        with:
          path: .build/dxvk
          key: ${{ steps.keys.outputs.dxvk }}

      - name: 10/12 Package, app and sources
        run: bash tools/ci-step.sh 10 package app bundle

      - name: 11/12 The archives
        id: archives
        run: |
          bash tools/ci-step.sh 11
          mono=$(sed -n 's/^MONO_VERSION=//p' tools/build.sh)
          cp ".build/downloads/wine-mono-$mono-src.tar.xz" "$PC5_RELEASE/"
          version=$(sed -n 's/^#define PC5_VERSION "\(.*\)"/\1/p' title/pc5.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd "$PC5_RELEASE"
          ls -l PPSA11018.zip PPSA11018-sources.tar.xz "wine-mono-$mono-src.tar.xz"
          sha256sum PPSA11018.zip PPSA11018-sources.tar.xz "wine-mono-$mono-src.tar.xz" | tee SHA256SUMS.txt
          {
            echo "### PC5 $version"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 12/12 Draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.archives.outputs.version }}
        # Notes from release-notes/<version>.md. A draft left by an earlier run is replaced;
        # a published release is never touched.
        run: |
          bash tools/ci-step.sh 12
          tag="v$VERSION"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$tag is already published; raise PC5_VERSION in title/pc5.h for a new release"
            exit 1
          fi
          [ "$state" = none ] || gh release delete "$tag" --yes
          notes="release-notes/$VERSION.md"
          [ -f "$notes" ] || { echo "PC5 $VERSION" > "$RUNNER_TEMP/notes.md"; notes=$RUNNER_TEMP/notes.md; }
          mono=$(sed -n 's/^MONO_VERSION=//p' tools/build.sh)
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "PC5 $VERSION" --notes-file "$notes" \
            "$PC5_RELEASE/PPSA11018.zip" "$PC5_RELEASE/PPSA11018-sources.tar.xz" "$PC5_RELEASE/wine-mono-$mono-src.tar.xz"
          echo "Draft release $tag is ready: check it and publish it from the Releases page." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the archives
        if: ${{ !inputs.draft_release }}
        uses: actions/upload-artifact@v4
        with:
          name: PC5-${{ steps.archives.outputs.version }}
          path: |
            /mnt/pc5/release/PPSA11018.zip
            /mnt/pc5/release/PPSA11018-sources.tar.xz
            /mnt/pc5/release/wine-mono-*-src.tar.xz
          compression-level: 0
          retention-days: 7

      - name: Why it failed
        if: failure()
        # The end of the newest step log as an annotation, which the run's page and the API show.
        run: |
          log=$(ls -t /mnt/pc5/build/logs/*.log 2>/dev/null | head -1)
          [ -n "$log" ] || exit 0
          tail -40 "$log" | cut -c1-300 > "$RUNNER_TEMP/tail.txt"
          body=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/tail.txt" | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=$(basename "$log")::$body"

      - name: The logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /mnt/pc5/build/logs/
          retention-days: 14
